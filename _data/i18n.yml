author_bio:
  it: "Informatico, padre e marito. Appassionato di tecnologia da sempre, curioso di natura. Nel tempo libero mi dedico alla famiglia, agli amici, alla cucina e ai videogiochi. Credo fortemente in ITIL come framework da applicare non solo all'IT ma anche a normali situazioni di vita quotidiana."
  en: "IT professional, father and husband. Passionate about technology for as long as I can remember, curious by nature. In my free time I focus on family, friends, cooking and video games. I strongly believe in ITIL as a framework that applies not just to IT but to everyday life too."

