- name:
    it: Robo-XCopy (Un front end per robocopy in stile Amiga)
    en: Robo-XCopy (An Amiga-style front end for robocopy)
  gh_user: Skyflash
  repo: RoboXCopy
  url: https://roboxcopy.com/
  img: /static/assets/img/blog/roboxcopy/cover.png
  desc:
    it: "Un'interfaccia grafica per robocopy di Windows nello stile di X-Copy dell'Amiga, scritta in Rust: simulazione (DRY RUN), comando sempre visibile e COPY BUILDER per costruire la copia passo passo. MIT."
    en: "A graphical front end for Windows robocopy in the style of the Amiga's X-Copy, written in Rust: dry run, always-visible command line and a COPY BUILDER to put the copy together step by step. MIT."

- name:
    it: DocSteer (Un tema Jekyll per la documentazione)
    en: DocSteer (A Jekyll theme for documentation)
  gh_user: Skyflash
  repo: docsteer
  url: https://cristiancastellari.it/docsteer/
  img: /static/assets/img/landing/docsteer.svg
  desc:
    it: "Un tema Jekyll veloce e senza framework per documentazione tecnica, portali di supporto e knowledge base interne: ricerca live, sei skin di colore con tema chiaro e scuro, lightbox per le immagini, indice automatico e SEO pronta all'uso. Pubblicato come gem, MIT."
    en: "A fast, framework-free Jekyll theme for technical documentation, support portals and internal knowledge bases: live search, six colour skins with light and dark mode, image lightbox, auto table of contents and SEO out of the box. Published as a gem, MIT."

