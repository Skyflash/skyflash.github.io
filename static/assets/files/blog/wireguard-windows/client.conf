# WireGuard client config - Windows 11
# Import this file from the WireGuard app ("Import tunnel(s) from file...").
#
# Replace CLIENT_PRIVATE_KEY, SERVER_PUBLIC_KEY and the Endpoint below with
# your own values before using this file - never reuse the keys from this
# example.

[Interface]
PrivateKey = CLIENT_PRIVATE_KEY
Address = 10.66.0.2/24
DNS = 192.168.1.1

[Peer]
PublicKey = SERVER_PUBLIC_KEY
Endpoint = vpn.tuodominio.it:51820
# Tunnel completo (tutto il traffico passa dalla VPN):
AllowedIPs = 0.0.0.0/0, ::/0
# In alternativa, per uno split tunnel che instrada solo la rete
# dell'ufficio, commenta la riga sopra e usa questa:
# AllowedIPs = 10.66.0.0/24, 192.168.1.0/24
PersistentKeepalive = 25
