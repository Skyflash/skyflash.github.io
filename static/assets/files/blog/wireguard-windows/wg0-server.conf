# WireGuard server config - Windows Server 2022
# Save as C:\WireGuard\wg0.conf and install with:
#   wireguard.exe /installtunnelservice C:\WireGuard\wg0.conf
#
# Replace SERVER_PRIVATE_KEY and every CLIENT_PUBLIC_KEY below with your own
# values before using this file - never reuse the keys from this example.

[Interface]
PrivateKey = SERVER_PRIVATE_KEY
Address = 10.66.0.1/24
ListenPort = 51820

# One [Peer] block per client. Duplicate this block and adjust the comment,
# the public key and the AllowedIPs (a single /32 address) for each device.
[Peer]
# laptop-01
PublicKey = CLIENT_PUBLIC_KEY
AllowedIPs = 10.66.0.2/32

[Peer]
# laptop-02
PublicKey = CLIENT_PUBLIC_KEY_2
AllowedIPs = 10.66.0.3/32
