---
layout: default
---
{% if page.wide %}
<section class="section">
  <div class="container">
    <div class="section-header">
      <h1>{{ page.title }}</h1>
    </div>
  </div>
  <div class="container container--wide">
    {{ content }}
  </div>
</section>
{% else %}
<section class="section container">
  <div class="section-header">
    <h1>{{ page.title }}</h1>
  </div>
  <div class="prose">
    {{ content }}
  </div>
</section>
{% endif %}
