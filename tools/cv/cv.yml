  Coordinatore Office Automation Systems: >-
    Gestione ed evoluzione dei servizi Office Automation del Gruppo: con Kace 1000 script
    automatizzati, configurazioni e installazioni software on demand su oltre 800 PC.
    Procedure ISO 27001 e documentazione interna.
  Referente Office Automation: >-
    Supporto Office Automation agli utenti del Gruppo Novomatic in Italia e gestione dei server
    Linux e Windows (Git, MDM, siti corporate, antivirus).
  Responsabile IT: >-
    Responsabile dell'infrastruttura IT e telefonica del Gruppo: tre società, sei filiali,
    oltre 100 utenti.

