profile: >-
  Da vent'anni mi occupo di infrastrutture IT, prima come amministratore di sistemi e oggi alla
  guida dell'unità IT & Service Management di Integra.
profile_sections:
  - title: Competenze comunicative
    text: >-
      Lavoro volentieri in team e costruisco con colleghi e clienti rapporti basati sulla fiducia,
      con un approccio diplomatico anche nelle situazioni più delicate.
  - title: Competenze organizzative
    text: >-
      Condivido gli obiettivi dell'azienda per cui lavoro e ne rispetto processi e ruoli. Nel mio
      percorso ho definito e portato a termine progetti anche importanti, con un approccio ITIL.
      Mi trovo a mio agio con gli strumenti di AI, come Claude.
# Frase finale del profilo, a sé come nel vecchio CV
profile_closing: Possiedo spiccate qualità di troubleshooting.

