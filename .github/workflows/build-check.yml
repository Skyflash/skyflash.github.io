name: Build & check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Check internal links, images and anchors
        run: bundle exec htmlproofer ./_site --disable-external --checks Links,Images
