{% assign privacy_it = '/it/about/privacy/' | relative_url %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.css">
<script src="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.umd.js"></script>
<script>
  CookieConsent.run({
    onConsent: function () {
      if (typeof loadAnalytics === 'function' && CookieConsent.acceptedCategory('analytics')) loadAnalytics();
      if (typeof loadComments === 'function' && CookieConsent.acceptedCategory('thirdparty')) loadComments();
    },
    onChange: function () {
      if (typeof loadAnalytics === 'function' && CookieConsent.acceptedCategory('analytics')) loadAnalytics();
      if (typeof loadComments === 'function' && CookieConsent.acceptedCategory('thirdparty')) loadComments();
    },
    categories: {
      necessary: {
        enabled: true,
        readOnly: true
      },
      analytics: {},
      thirdparty: {}
    },
    language: {
      default: 'it',
      autoDetect: 'document',
      translations: {
        it: {
          consentModal: {
            title: 'Questo sito usa i cookie',
            description: 'Uso cookie tecnici necessari al funzionamento del sito, cookie di analisi (Google Analytics, con IP anonimizzato) per capire come viene usato il sito, e un widget di terze parti (Giscus, basato su GitHub Discussions) per i commenti sotto i post del blog, caricato solo se acconsenti. <a href="{{ privacy_it }}">Leggi l’informativa privacy</a>.',
            acceptAllBtn: 'Accetta tutto',
            acceptNecessaryBtn: 'Solo necessari',
            showPreferencesBtn: 'Gestisci preferenze',
            footer: '<a href="{{ privacy_it }}">Privacy policy</a>'
          },
          preferencesModal: {
            title: 'Preferenze sui cookie',
            acceptAllBtn: 'Accetta tutto',
            acceptNecessaryBtn: 'Solo necessari',
            savePreferencesBtn: 'Salva le preferenze',
            closeIconLabel: 'Chiudi',
            sections: [
              {
                title: 'Cookie tecnici',
                description: 'Necessari al funzionamento del sito: lingua, tema chiaro/scuro, preferenze di consenso. Non possono essere disattivati.',
                linkedCategory: 'necessary'
              },
              {
                title: 'Cookie di analisi',
                description: 'Google Analytics, con anonimizzazione dell’IP, per capire come viene usato il sito.',
                linkedCategory: 'analytics'
              },
              {
                title: 'Cookie di terze parti',
                description: 'Caricano il widget Giscus (GitHub Discussions) per mostrare e gestire i commenti sotto i post del blog.',
                linkedCategory: 'thirdparty'
              }
            ]
          }
        },
        en: {
          consentModal: {
            title: 'This site uses cookies',
            description: 'I use technical cookies required for the site to work, analytics cookies (Google Analytics, with anonymized IP) to understand how the site is used, and a third-party widget (Giscus, backed by GitHub Discussions) for comments under blog posts, loaded only if you agree. <a href="{{ privacy_it }}">Read the privacy policy</a> (Italian only, for now).',
            acceptAllBtn: 'Accept all',
            acceptNecessaryBtn: 'Necessary only',
            showPreferencesBtn: 'Manage preferences',
            footer: '<a href="{{ privacy_it }}">Privacy policy</a>'
          },
          preferencesModal: {
            title: 'Cookie preferences',
            acceptAllBtn: 'Accept all',
            acceptNecessaryBtn: 'Necessary only',
            savePreferencesBtn: 'Save preferences',
            closeIconLabel: 'Close',
            sections: [
              {
                title: 'Technical cookies',
                description: 'Required for the site to work: language, light/dark theme, consent preferences. Cannot be disabled.',
                linkedCategory: 'necessary'
              },
              {
                title: 'Analytics cookies',
                description: 'Google Analytics, with anonymized IP, to understand how the site is used.',
                linkedCategory: 'analytics'
              },
              {
                title: 'Third-party cookies',
                description: 'Load the Giscus widget (GitHub Discussions) to show and manage comments under blog posts.',
                linkedCategory: 'thirdparty'
              }
            ]
          }
        }
      }
    }
  });
</script>
