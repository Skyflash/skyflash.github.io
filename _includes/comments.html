{% if site.disqus %}
{% assign short_lang = page.lang | slice: 0, 2 | default: site.default_lang %}
{% assign page_url = site.url | append: site.baseurl | append: page.url %}

<div id="disqus_thread"></div>
<script type="text/javascript">
  var disqus_config = function () {
    this.page.url = "{{ page_url }}";
    this.page.identifier = "{{ page_url }}";
  };
</script>
<script type="text/plain" data-category="thirdparty" data-service="Disqus" data-src="https://{{ site.disqus.name }}.disqus.com/embed.js"></script>
<noscript>{{ site.data.i18n.comments_js_required[short_lang] }}</noscript>
{% endif %}
