{% if site.giscus %}
{% assign short_lang = page.lang | slice: 0, 2 | default: site.default_lang %}
<div id="giscus-comments"></div>
<script>
  window.loadComments = function () {
    if (document.getElementById('giscus-script')) return;
    var s = document.createElement('script');
    s.id = 'giscus-script';
    s.src = 'https://giscus.app/client.js';
    s.setAttribute('data-repo', '{{ site.giscus.repo }}');
    s.setAttribute('data-repo-id', '{{ site.giscus.repo_id }}');
    s.setAttribute('data-category', '{{ site.giscus.category }}');
    s.setAttribute('data-category-id', '{{ site.giscus.category_id }}');
    s.setAttribute('data-mapping', 'pathname');
    s.setAttribute('data-strict', '0');
    s.setAttribute('data-reactions-enabled', '1');
    s.setAttribute('data-emit-metadata', '0');
    s.setAttribute('data-input-position', 'bottom');
    s.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') || 'preferred_color_scheme');
    s.setAttribute('data-lang', '{{ short_lang }}');
    s.setAttribute('crossorigin', 'anonymous');
    s.async = true;
    document.getElementById('giscus-comments').appendChild(s);
  };
</script>
<noscript>{{ site.data.i18n.comments_js_required[short_lang] }}</noscript>
{% endif %}
