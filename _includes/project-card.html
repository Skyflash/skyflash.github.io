{% assign project = include.project %}
<article class="card">
  {% if project.img %}<img class="card__image" src="{{ project.img | relative_url }}" alt="" loading="lazy">{% endif %}
  <h3 class="card__title">
    {% if project.url %}
    <a href="{{ project.url }}" target="_blank" rel="noopener">{{ project.name }}</a>
    {% elsif project.repo %}
    <a href="https://github.com/{{ project.gh_user }}/{{ project.repo }}" target="_blank" rel="noopener">{{ project.name }}</a>
    {% else %}
    {{ project.name }}
    {% endif %}
  </h3>
  <p class="card__desc">{{ project.desc }}</p>
  {% if project.repo %}
  <div class="pill-row" data-gh-user="{{ project.gh_user }}" data-gh-repo="{{ project.repo }}">
    <a class="pill" href="https://github.com/{{ project.gh_user }}/{{ project.repo }}" target="_blank" rel="noopener"><i class="fa fa-github" aria-hidden="true"></i>&nbsp;GitHub</a>
    <span class="pill pill--stat" data-gh-stat="stars"><i class="fa fa-star" aria-hidden="true"></i>&nbsp;–</span>
    <span class="pill pill--stat" data-gh-stat="forks"><i class="fa fa-code-fork" aria-hidden="true"></i>&nbsp;–</span>
  </div>
  {% endif %}
</article>
