<header class="site-header">
  <nav class="nav container" aria-label="Navigazione principale">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>

    <div class="nav-actions" style="display:flex; align-items:center; gap: var(--space-2);">
      <div class="theme-switch" role="group" aria-label="Tema colore">
        <button type="button" class="theme-switch__btn" data-theme-choice="auto" aria-label="Tema automatico (segue il sistema)" aria-pressed="false"><i class="fa fa-adjust" aria-hidden="true"></i></button>
        <button type="button" class="theme-switch__btn" data-theme-choice="light" aria-label="Tema chiaro" aria-pressed="false"><i class="fa fa-sun-o" aria-hidden="true"></i></button>
        <button type="button" class="theme-switch__btn" data-theme-choice="dark" aria-label="Tema scuro" aria-pressed="false"><i class="fa fa-moon-o" aria-hidden="true"></i></button>
      </div>
      <button type="button" class="nav-search-toggle" id="nav-search-toggle" aria-label="Cerca nel blog" aria-expanded="false" aria-controls="search-panel">
        <i class="fa fa-search" aria-hidden="true"></i>
      </button>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Apri il menu" aria-expanded="false" aria-controls="nav-list">
        <i class="fa fa-bars" aria-hidden="true"></i>
      </button>
    </div>

    <ul class="nav-list" id="nav-list">
      <li><a class="nav-link {% if page.url == '/' %}is-active{% endif %}" href="{{ '/' | relative_url }}">Home</a></li>
      <li><a class="nav-link {% if page.url == '/cv/' %}is-active{% endif %}" href="{{ '/cv/' | relative_url }}">CV</a></li>
      <li><a class="nav-link {% if page.url == '/progetti/' %}is-active{% endif %}" href="{{ '/progetti/' | relative_url }}">Progetti</a></li>
      <li class="nav-item">
        <a class="nav-link {% if page.layout == 'post' or page.layout == 'category' or page.layout == 'blog-index' %}is-active{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a>
        <button type="button" class="nav-caret" id="nav-blog-toggle" aria-label="Mostra le categorie del blog" aria-expanded="false" aria-controls="nav-blog-submenu">
          <i class="fa fa-chevron-down" aria-hidden="true"></i>
        </button>
        <ul class="nav-submenu" id="nav-blog-submenu">
          {% for category in site.data.blog %}
          <li><a href="{{ category.href | relative_url }}">{{ category.name }}</a></li>
          {% endfor %}
        </ul>
      </li>
      <li><a class="nav-link {% if page.url == '/contatti/' %}is-active{% endif %}" href="{{ '/contatti/' | relative_url }}">Contatti</a></li>
    </ul>
  </nav>

  <div class="search-panel" id="search-panel" hidden>
    <div class="container">
      <label class="visually-hidden" for="search-input">Cerca nel blog</label>
      <input type="search" id="search-input" class="search-input" placeholder="Cerca negli articoli del blog…" autocomplete="off">
      <ul id="search-results" class="search-results"></ul>
    </div>
  </div>
</header>
