{% assign career = include.career %}
<div class="timeline-item{% if career.present %} timeline-item--present{% endif %}">
  <p class="timeline-item__date">
    {{ career.date.detail }}
    {% if career.present %}<span class="badge-present">Attuale</span>{% endif %}
  </p>
  <h3 class="timeline-item__title">{{ career.job.detail }}</h3>
  <p class="timeline-item__company">{{ career.name.detail }}</p>
  {% if career.desc.detail %}<p class="timeline-item__desc">{{ career.desc.detail }}</p>{% endif %}
</div>
